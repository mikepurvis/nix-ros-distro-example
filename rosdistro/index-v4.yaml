%YAML 1.1
# Index for this repo's own distros. update-overlay builds it into a copy of
# the rosdistro tree nix-ros-overlay pins, so rosdep and the rest of that
# tree come along unchanged.
---
distributions:
  mango:
    distribution: [mango/distribution.yaml]
    distribution_status: rolling
    distribution_type: ros2
    python_version: 3
type: index
version: 4
